name: release

# Every new tag: run the tests, build the Windows executable and publish it as a GitHub release.
#   1. raise `version` in pyproject.toml, commit, push
#   2. git tag v<version> && git push origin v<version>
on:
  push:
    tags: ["**"]

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write  # creating the release and uploading its files
    env:
      PYTHONIOENCODING: utf-8
      # a tag name is text somebody chose: it goes through the environment, never into a script body
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[build]"

      - name: The tag must name the version being built
        # the executable shows the version of pyproject.toml in its properties; a release called v1.0.0 that holds
        # a 0.3.1 build would be mislabelled. A leading "v" is allowed.
        run: |
          $version = python -c "import importlib.metadata as m; print(m.version('sindex'))"
          if ($env:TAG -ne $version -and $env:TAG -ne "v$version") {
            Write-Error "tag '$env:TAG' does not match version $version in pyproject.toml; raise the version and tag again"
            exit 1
          }

      - name: Build sindex.exe
        run: python packaging/build.py

      - name: Smoke test
        run: |
          if (-not (Test-Path dist\sindex\sindex.exe)) { Write-Error "dist\sindex\sindex.exe was not built"; exit 1 }
          dist\sindex\sindex.exe --help
          if ($LASTEXITCODE -ne 0) { Write-Error "sindex.exe --help failed"; exit 1 }

      - name: Pack
        run: |
          $safe = $env:TAG -replace '[\\/]', '-'
          $zip = "sindex-$safe-windows-x64.zip"
          Compress-Archive -Path dist\sindex -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path "$zip.sha256" -Value "$hash  $zip" -Encoding ascii
          "ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish the release
        run: gh release create $env:TAG $env:ZIP "$env:ZIP.sha256" --title $env:TAG --generate-notes --verify-tag
