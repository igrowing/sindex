<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sindex search</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main>
  <a class="gear" href="/settings" title="Settings">&#9881; Settings</a>
  <details id="statusBox">
    <summary><h1>sindex</h1><span class="ver">v{{VERSION}}</span><span id="state"><span class="dot"></span>…</span></summary>
    <div class="panel">
      <table id="statusTable"></table>
      <div class="row" style="margin-top:10px">
        <button type="button" class="plain" id="pauseBtn">Pause</button>
        <input id="reindexPath" placeholder="File or folder to reindex" style="flex:1 1 260px">
        <button type="button" class="plain" id="reindexBtn">Reindex</button>
        <a class="plain" href="/log">Log</a>
      </div>
    </div>
  </details>

  <form id="form" autocomplete="off">
    <div class="hint">Hints: Words must all appear, each as the start of a word · <code>"exact phrase"</code> · <code>*word</code> anywhere in a word · <code>-exclude</code> · <code>OR</code></div>
    <div class="row">
      <input id="query" type="search" placeholder="Search file contents…" autofocus>
      <button type="submit">Search</button>
    </div>
    <div id="slowNote" class="slownote" role="status" hidden></div>
    <div id="progress" class="progress" role="progressbar" aria-label="Searching" hidden></div>
    <div class="checks">
      <label class="check"><input id="names" type="checkbox"> Also in folder- and file-names</label>
      <label class="check" title="The query becomes one regular expression for the file contents and, with the names box, for the full path (folder\file name). It reads all the text, so it is slow; results show while it runs."><input id="regex" type="checkbox"> Use RegEx</label>
      <label class="check" title="The typed letters must match exactly, in the file contents and, with the names box, in folder and file names. The text of every match is checked, so it is slower; results show while it runs."><input id="case" type="checkbox"> Case sensitive</label>
    </div>
    <div class="row filters">
      <label>In folder <input id="path" placeholder="D:\Documents"></label>
      <label>Extensions <input id="ext" placeholder="pdf docx"></label>
      <label>Modified after <input id="after" type="date"></label>
      <label>Modified before <input id="before" type="date"></label>
    </div>
    <details id="mediaFilters">
      <summary>Photos &amp; videos</summary>
      <div class="row filters">
        <label>Kind
          <select id="kind"><option value="">Any</option><option value="image">Image</option><option value="video">Video</option></select>
        </label>
        <label>Camera <input id="camera" placeholder="Canon"></label>
        <label>GPS
          <select id="has_gps"><option value="">Any</option><option value="1">Has location</option><option value="0">No location</option></select>
        </label>
        <label>Resolution at least
          <select id="min_height"><option value="">Any</option><option value="480">480p</option><option value="720">720p</option><option value="1080">1080p</option><option value="2160">4K</option></select>
        </label>
        <label>Duration at least (s) <input id="min_duration" type="number" min="0"></label>
        <label>Duration at most (s) <input id="max_duration" type="number" min="0"></label>
        <label>Taken after <input id="taken_after" type="date"></label>
        <label>Taken before <input id="taken_before" type="date"></label>
      </div>
    </details>
  </form>

  <div class="resultbar">
    <div id="summary"></div>
    <label id="sortBox" class="sort" hidden>Sort by
      <select id="sort">
        <option value="path_asc">Path A-Z</option>
        <option value="path_desc">Path Z-A</option>
        <option value="name_asc">File name A-Z</option>
        <option value="name_desc">File name Z-A</option>
        <option value="size_asc">File size increasing</option>
        <option value="size_desc">File size decreasing</option>
        <option value="date_asc">Date time: older first</option>
        <option value="date_desc">Date time: newer first</option>
        <option value="relevance" selected>Relevance (searched words closer - higher relevance)</option>
      </select>
    </label>
  </div>
  <div id="extBar" class="extbar" hidden>
    <details class="multi" id="onlyMenu">
      <summary><span class="lbl">Show only files with extension(s):</span> <b class="val">ALL</b></summary>
      <div class="panel" id="onlyPanel"></div>
    </details>
    <details class="multi" id="skipMenu">
      <summary><span class="lbl">Exclude files with extension(s):</span> <b class="val">NONE</b></summary>
      <div class="panel" id="skipPanel"></div>
    </details>
    <button type="button" class="plain export" id="exportBtn" disabled
      title="Save all the files of this search (every page, in the sort order and with the extension filters shown) as a CSV file: path, file name, size, date and time, text found. Available when the search has results.">Export to CSV</button>
  </div>
  <div id="exportErr" class="exporterr" role="alert" hidden>
    <span id="exportErrText"></span>
    <button type="button" class="plain" id="exportErrClose">OK</button>
  </div>
  <ol id="results"></ol>
  <div class="pager" id="pager"></div>

</main>
<div id="toast"></div>

<script>
const TOKEN = {{TOKEN}};
const $ = (id) => document.getElementById(id);
const PAGE = 20;
const COMPLETE_AFTER = {{COMPLETE_AFTER}};  // seconds without typing before the search starts by itself; 0 = Enter only
const TAB = Math.random().toString(36).slice(2, 12);  // lets the server stop this tab's superseded searches
let offset = 0;
let seq = 0, inflight = null, typeTimer = null;
const POLL_MS = 1000;  // how often the page asks a slow search, which runs on in the server, what it has found so far
let job = false, pollTimer = null, shown = "";  // a slow search runs on; what the result list shows
let lastParams = null;  // the parameters of the search whose results are on the page
let exporting = false;

function toast(msg, ms = 1600) {
  const t = $("toast"); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.opacity = 0, ms);
}
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function fmtSize(n) {
  if (n < 1024) return n + " B";
  const u = ["KB", "MB", "GB"]; let i = -1;
  do { n /= 1024; i++; } while (n >= 1024 && i < u.length - 1);
  return n.toFixed(n < 10 ? 1 : 0) + " " + u[i];
}
function fmtDate(sec) { return new Date(sec * 1000).toLocaleString(); }
function fmtDuration(s) { s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
function fmtMedia(m) {
  if (!m) return "";
  const parts = [];
  if (m.width && m.height) parts.push(`${m.width}×${m.height}`);
  if (m.duration_s != null) parts.push(fmtDuration(m.duration_s));
  if (m.camera) parts.push(esc(m.camera));
  if (m.taken_at) parts.push(esc(m.taken_at.slice(0, 10)));
  return parts.length ? `<div class="media">${parts.join(" · ")}</div>` : "";
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); } catch { prompt("Copy:", text); }
}
// target: "file" (in its associated app) or "folder" (in Explorer, with the file selected)
async function openPath(path, target) {
  const r = await fetch("/api/open", {
    method: "POST", headers: { "Content-Type": "application/json", "X-Sindex-Token": TOKEN },
    body: JSON.stringify({ path, target }),
  });
  const data = await r.json().catch(() => ({}));
  toast(r.ok ? "Opening…" : (data.error || `Could not open the ${target}`));
}

const MEDIA_KEYS = ["kind", "camera", "has_gps", "min_height", "min_duration", "max_duration", "taken_after", "taken_before"];
const NAME_MODS = ["regex", "case"];  // independent of "names" and of each other
function hasMediaFilter() { return MEDIA_KEYS.some((k) => $(k).value); }

function params() {
  const p = new URLSearchParams({ query: $("query").value, offset });
  for (const k of ["path", "ext", "after", "before", ...MEDIA_KEYS]) if ($(k).value) p.set(k, $(k).value);
  if ($("names").checked) p.set("names", "1");
  if ($("sort").value !== "relevance") p.set("sort", $("sort").value);
  for (const [name, m] of Object.entries(EXT_MENUS))  // "no extension" travels as a dot
    if (m.sel.size) p.set(name + "_ext", [...m.sel].map(e => e || ".").join(","));
  for (const k of NAME_MODS) if ($(k).checked) p.set(k, "1");
  return p;
}

// The two extension menus. Each has a generic choice (ALL, NONE) that means "no filter"; choosing any extension
// in one menu greys the other out until the first is back at its generic choice.
const EXT_MENUS = {
  only: { generic: "ALL", other: "skip", sel: new Set() },
  skip: { generic: "NONE", other: "only", sel: new Set() },
};
let extList = [], extKey = "";  // [extension, count] of all files found, and what the panels were built from
const extLabel = (e) => e === "" ? "(no extension)" : e;
function clearExtSelection() { for (const m of Object.values(EXT_MENUS)) m.sel.clear(); }

function buildExtPanels() {
  const known = new Set(extList.map(([e]) => e));
  const key = JSON.stringify([extList, Object.values(EXT_MENUS).flatMap(m => [...m.sel]).filter(e => !known.has(e))]);
  if (key === extKey) return;  // nothing new: keep the open panel where the person scrolled it
  extKey = key;
  for (const [name, m] of Object.entries(EXT_MENUS)) {
    // what is selected stays on offer even when this search did not find it (a page opened from an address)
    const offered = new Map(extList);
    for (const e of m.sel) if (!offered.has(e)) offered.set(e, 0);
    $(name + "Panel").innerHTML =
      `<label class="opt generic"><input type="checkbox" data-generic="1"> ${m.generic}</label>` +
      [...offered].map(([e, n]) =>
        `<label class="opt"><input type="checkbox" data-ext="${esc(e)}"> ${esc(extLabel(e))} <span class="n">${n}</span></label>`).join("");
  }
}
function syncExtMenus() {
  for (const [name, m] of Object.entries(EXT_MENUS)) {
    const menu = $(name + "Menu"), shown = [...m.sel].map(extLabel);
    menu.querySelector(".val").textContent = !shown.length ? m.generic
      : shown.length <= 3 ? shown.join(", ") : `${shown.slice(0, 3).join(", ")} +${shown.length - 3}`;
    for (const box of $(name + "Panel").querySelectorAll("input"))
      box.checked = "generic" in box.dataset ? m.sel.size === 0 : m.sel.has(box.dataset.ext);
    const waiting = EXT_MENUS[m.other].sel.size > 0;
    menu.classList.toggle("off", waiting);
    menu.inert = waiting;
    if (waiting) menu.open = false;
  }
}
function pickExtension(name, box) {
  const m = EXT_MENUS[name];
  if ("generic" in box.dataset) m.sel.clear();  // ALL / NONE: back to no filter
  else if (box.checked) m.sel.add(box.dataset.ext);
  else m.sel.delete(box.dataset.ext);  // the last one unchecked is the generic choice again
  syncExtMenus();
  offset = 0; runSearch({ reuse: true });
}
for (const name of Object.keys(EXT_MENUS))
  $(name + "Panel").addEventListener("change", (e) => pickExtension(name, e.target));
document.addEventListener("click", (e) => {  // a dropdown closes when the person clicks anywhere else
  for (const d of document.querySelectorAll("details.multi[open]")) if (!d.contains(e.target)) d.open = false;
});

function clearResults() {
  $("results").innerHTML = ""; $("summary").textContent = ""; $("pager").innerHTML = ""; lastTotal = 0; shown = "";
  $("sortBox").hidden = true; $("extBar").hidden = true; clearExtSelection();
  hideExportError(); syncExport();
}
function setBusy(on) { $("progress").hidden = !on; syncExport(); }
function syncExport() { $("exportBtn").disabled = exporting || !lastTotal || inflight !== null || job; }

// A `*` or `?` at the start or inside a word: the word index cannot answer it, the server reads all the text.
// The same rule as search._parse: a trailing star or question mark changes nothing.
function hasWildcards(text) {
  for (const m of text.matchAll(/(-?)"([^"]*)"(\*?)|(\S+)/g)) {
    let term;
    if (m[4] === undefined) term = m[2].replace(/^[*?]+|[*?]+$/g, "");
    else if (m[4] === "OR") continue;
    else term = (m[4].length > 1 && m[4].startsWith("-") ? m[4].slice(1) : m[4]).replace(/[*?]+$/, "");
    if (/[*?]/.test(term) && /[\p{L}\p{N}_]/u.test(term)) return true;
  }
  return false;
}
// Says at once, under the search box, what makes this search slow (search.is_slow on the server).
function updateSlowNote() {
  const why = [];
  if ($("regex").checked) why.push("RegEx");
  else if (hasWildcards($("query").value)) why.push("wildcards");
  if ($("case").checked) why.push("case sensitive");
  const note = $("slowNote");
  note.hidden = !why.length;
  note.textContent = why.length ? `Using ${why.join(" and ")} slows the search down; results show as they are found.` : "";
}

// The search that is running is no longer wanted. Closing the request does not stop the query inside the
// server, so the server is told as well; a slow search that runs on in the server too, unless `keepJob` (another
// sort or page of it, or the next poll).
function stopSearch({ keepJob = false } = {}) {
  clearTimeout(typeTimer); typeTimer = null;
  clearTimeout(pollTimer); pollTimer = null;
  const running = inflight !== null || job;
  if (inflight) { inflight.ctl.abort(); inflight = null; }
  // `seq` is above every request sent so far: the server stops this tab's search if it is one of them
  if (running && !keepJob)
    fetch("/api/search/cancel?" + new URLSearchParams({ tab: TAB, seq }), { keepalive: true }).catch(() => {});
  if (!keepJob) job = false;
  seq++;  // an answer that is still on its way is dropped
  setBusy(job);
}

// reuse: another sort order or page of the same search, which the server still has; it only re-orders it.
// poll: ask a slow search that runs on in the server for what it has found so far.
async function runSearch({ reuse = false, keepExt = false, poll = false } = {}) {
  stopSearch({ keepJob: reuse });
  hideExportError();
  if (!reuse && !keepExt) clearExtSelection();  // a new search has other extensions to choose from
  if (!$("query").value.trim() && !hasMediaFilter()) { clearResults(); return; }
  const p = params(), mine = seq, ctl = new AbortController();
  inflight = { ctl, seq: mine };
  setBusy(true);
  if (!poll) $("summary").textContent = "Searching…";
  history.replaceState(null, "", "?" + p);
  const query = new URLSearchParams(p);
  query.set("tab", TAB); query.set("seq", mine);
  if (reuse) query.set("reuse", "1");
  const res = await fetch("/api/search?" + query, { signal: ctl.signal }).then(r => r.json())
    .catch(e => e.name === "AbortError" ? null : ({ error: String(e), results: [] }));
  if (!res || mine !== seq || res.cancelled) return;  // stopped or replaced by a newer search
  inflight = null;
  job = !!res.running;
  setBusy(job);
  if (job) pollTimer = setTimeout(() => runSearch({ reuse: true, poll: true }), POLL_MS);
  const sum = $("summary");
  $("sortBox").hidden = !res.total;
  extList = res.extensions || [];
  const found = res.found_total ?? res.total;  // an error has neither
  $("extBar").hidden = !found;
  buildExtPanels(); syncExtMenus();
  if (res.error) { sum.innerHTML = `<span class="err">${esc(res.error)}</span>`; }
  else if (!res.total) {
    sum.textContent = job ? "Searching… nothing found yet."
      : found ? "No files with the selected extensions." : "No matches.";
  }
  else {
    const count = res.total === found ? res.total : `${res.total} of ${found}`;
    sum.textContent = (job ? "Searching… " : "") + `${count}${res.capped ? "+" : ""} file${res.total === 1 ? "" : "s"}`
      + (job ? " found so far" : "") + ` · showing ${offset + 1}–${offset + res.results.length}`;
  }
  // a poll that found nothing new leaves the list alone, so that it does not flicker under the reader
  const sig = JSON.stringify([offset, res.results.map(r => [r.path, r.hits, r.snippet])]);
  if (sig !== shown || !poll) { shown = sig; renderResults(res); }
  lastTotal = res.total;
  lastParams = p;
  syncExport();
  renderPager(res.total);
}
function renderResults(res) {
  $("results").innerHTML = res.results.map((r, i) => `
    <li class="hit">
      <div class="dir">${esc(r.dir)}\\</div>
      <div class="name">${esc(r.name)}</div>
      <div class="snip">${r.snippet}</div>
      ${fmtMedia(r.media)}
      <div class="meta">
        <span>${fmtSize(r.size)}</span><span>${fmtDate(r.mtime)}</span>
        ${r.status !== "ok" ? `<span>${esc(r.status)}</span>` : ""}
        ${r.hits === 0 && !res.negative_only ? `<span>folder or file name match</span>` : ""}
        <button class="plain" data-open="${i}" title="Open in its associated app (only while sindex runs in your own session)">Open file</button>
        <button class="plain" data-open-dir="${i}" title="Show the file in its folder in Explorer (only while sindex runs in your own session)">Open folder</button>
        <button class="plain" data-copy="${i}" data-what="path">Copy path</button>
        <button class="plain" data-copy="${i}" data-what="dir">Copy folder</button>
      </div>
    </li>`).join("");
  $("results").querySelectorAll("[data-copy]").forEach(b =>
    b.onclick = () => copy(res.results[+b.dataset.copy][b.dataset.what]));
  $("results").querySelectorAll("[data-open]").forEach(b =>
    b.onclick = () => openPath(res.results[+b.dataset.open].path, "file"));
  $("results").querySelectorAll("[data-open-dir]").forEach(b =>
    b.onclick = () => openPath(res.results[+b.dataset.openDir].path, "folder"));
}
// Export every file of the search on the page (not just the page shown) as a CSV file. The browser does the
// saving, as for any download: one that is set to ask where to save shows its Save dialog (name and folder), the
// others put sindex-<search words>-DATE.csv in the Downloads folder. Writing the file from the page (the File System
// Access API, with a Save dialog of its own) was dropped: a browser can refuse the write into the file the person just chose, and then
// the person is asked twice. A failure stays on the page until dismissed: it is long and has to be readable.
function showExportError(e) {
  console.error("CSV export failed", e);
  $("exportErrText").textContent = "Export failed: " + e.message;
  $("exportErr").hidden = false;
}
function hideExportError() { $("exportErr").hidden = true; }
$("exportErrClose").onclick = hideExportError;

async function exportHttpError(r) {
  const text = (await r.text().catch(() => "")).trim();
  let detail = text;
  try { detail = JSON.parse(text).error || text; } catch { /* not JSON: the text is the message */ }
  if (r.status === 404)
    return "HTTP 404: the running sindex does not know the export request. It is older than this page: restart sindex "
      + "(stop and start the service, or run `sindex run` again).";
  return "HTTP " + r.status + (detail ? ": " + detail.slice(0, 300) : "");
}

function downloadCsv(blob, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function exportCsv() {
  if (exporting || !lastTotal || !lastParams) return;
  const btn = $("exportBtn"), count = lastTotal;
  hideExportError();
  exporting = true; syncExport(); btn.textContent = "Exporting…";
  try {
    const q = new URLSearchParams(lastParams);
    q.delete("offset"); q.set("tab", TAB); q.set("reuse", "1");  // reuse: the server still has this search
    let r;
    try { r = await fetch("/api/export.csv?" + q); }
    catch (e) { throw new Error("cannot reach sindex (" + e.message + ")"); }
    if (!r.ok) throw new Error(await exportHttpError(r));
    // the server names the file after the search words (and has made them safe for a file name)
    const named = /filename\*=UTF-8''([^;]+)/i.exec(r.headers.get("Content-Disposition") || "");
    if (!named) throw new Error("the server sent no file name");
    const name = decodeURIComponent(named[1]);
    downloadCsv(await r.blob(), name);
    toast(`Exported ${count} file${count === 1 ? "" : "s"} as ${name}. The browser saves it: in the Downloads folder, `
      + "or where you choose if it asks.", 7000);
  } catch (e) { showExportError(e); }
  finally { exporting = false; btn.textContent = "Export to CSV"; syncExport(); }
}
$("exportBtn").onclick = exportCsv;

function pageBtn(label, to) {
  const b = document.createElement("button"); b.className = "plain"; b.textContent = label;
  b.onclick = () => { offset = to; runSearch({ reuse: true }); window.scrollTo(0, 0); }; return b;
}

let lastTotal = 0;

// A contiguous block of page numbers, always anchored at page 1 and the last page, sized to fit whatever
// horizontal space #pager actually has (so more pages show up on a wide window, fewer on a narrow one).
function pageWindow(current, total, slots) {
  const set = new Set([1, total, current]);
  for (let radius = 1; set.size < slots; radius++) {
    const before = set.size;
    if (current - radius >= 1) set.add(current - radius);
    if (set.size < slots && current + radius <= total) set.add(current + radius);
    if (set.size === before) break; // nothing left to add on either side
  }
  return [...set].filter((p) => p >= 1 && p <= total).sort((a, b) => a - b);
}

function renderPager(total) {
  const pager = $("pager");
  const totalPages = Math.max(1, Math.ceil(total / PAGE));
  const current = Math.min(Math.floor(offset / PAGE) + 1, totalPages);
  pager.innerHTML = "";
  if (totalPages <= 1) return;

  const hasPrev = current > 1, hasNext = current < totalPages;
  const reserved = (hasPrev ? 100 : 0) + (hasNext ? 80 : 0);
  const available = Math.max(0, (pager.clientWidth || document.querySelector("main").clientWidth) - reserved);
  const slots = Math.max(3, Math.floor(available / 38));

  if (hasPrev) pager.append(pageBtn("← Previous", offset - PAGE));
  let prev = null;
  for (const p of pageWindow(current, totalPages, slots)) {
    if (prev !== null && p - prev > 1) { const s = document.createElement("span"); s.className = "dots"; s.textContent = "…"; pager.append(s); }
    const b = document.createElement("button");
    b.className = "plain" + (p === current ? " on" : "");
    b.textContent = p;
    if (p === current) b.disabled = true;
    else b.onclick = () => { offset = (p - 1) * PAGE; runSearch({ reuse: true }); window.scrollTo(0, 0); };
    pager.append(b);
    prev = p;
  }
  if (hasNext) pager.append(pageBtn("Next →", offset + PAGE));
}

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => renderPager(lastTotal), 150);
});

async function post(action, body) {
  const r = await fetch("/api/" + action, {
    method: "POST", headers: { "Content-Type": "application/json", "X-Sindex-Token": TOKEN },
    body: JSON.stringify(body || {}),
  });
  return r.ok;
}

async function refreshStatus() {
  const s = await fetch("/api/status").then(r => r.json()).catch(() => null);
  if (!s) return;
  const ix = s.indexer || {}, idx = s.index || {}, sup = s.supervisor;
  const alive = sup ? sup.running : ix.age_s !== null && ix.age_s < 90;
  const state = ix.user_paused ? "paused" : (ix.state || "unknown");
  $("state").innerHTML = `<span class="dot ${alive ? "on" : ""}"></span>${esc(alive ? state : "indexer not running")}` +
    (idx.total_files !== undefined ? ` · ${idx.total_files.toLocaleString()} files · ${idx.queued.toLocaleString()} queued` : "");
  const rows = [
    ["State", state + (ix.paused_reason && !ix.user_paused ? ` (${ix.paused_reason})` : "")],
    ["Working on", ix.detail || "—"],
    ["Indexer memory", ix.rss_mb !== undefined ? ix.rss_mb + " MB" : "—"],
    ["Roots", (ix.roots || []).join(", ") || "—"],
    ["USN journal", Object.entries(ix.usn || {}).map(([k, v]) => `${k} ${v ? "on" : "rescans"}`).join(", ") || "—"],
    ["Files by status", Object.entries(idx.files || {}).map(([k, v]) => `${k}: ${v.toLocaleString()}`).join(", ") || "—"],
    ["Index size", idx.db_mb !== undefined ? idx.db_mb + " MB" : "—"],
  ];
  if (sup) rows.push(["Process restarts", `${sup.restarts} (recycling)`]);
  $("statusTable").innerHTML = rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(String(v))}</td></tr>`).join("");
  $("pauseBtn").textContent = ix.user_paused ? "Resume" : "Pause";
  $("pauseBtn").dataset.paused = ix.user_paused ? "1" : "";
}

// Searching starts on Enter, or by itself COMPLETE_AFTER seconds after the last keystroke. Any change of the
// text stops the search that is running and waits again.
function onType() {
  updateSlowNote();
  const wasRunning = !!inflight || job;
  stopSearch();
  offset = 0;
  if (!$("query").value.trim() && !hasMediaFilter()) { clearResults(); return; }
  if (wasRunning) {
    $("summary").textContent = COMPLETE_AFTER > 0 ? "Search stopped; it starts again when you pause typing."
                                                  : "Search stopped; press Enter to search again.";
  }
  if (COMPLETE_AFTER > 0) typeTimer = setTimeout(runSearch, COMPLETE_AFTER * 1000);
}
$("query").addEventListener("input", onType);
$("form").onsubmit = (e) => { e.preventDefault(); offset = 0; runSearch(); };
$("names").onchange = () => { offset = 0; runSearch(); };
$("sort").onchange = () => { offset = 0; runSearch({ reuse: true }); };
for (const k of NAME_MODS) $(k).onchange = () => { updateSlowNote(); offset = 0; runSearch(); };
for (const k of MEDIA_KEYS) $(k).addEventListener("change", () => { offset = 0; runSearch(); });
$("pauseBtn").onclick = async () => {
  await post($("pauseBtn").dataset.paused ? "resume" : "pause"); refreshStatus();
};
$("reindexBtn").onclick = async () => {
  const path = $("reindexPath").value.trim(); if (!path) return;
  toast(await post("reindex", { path }) ? "Reindex queued" : "Failed");
  $("reindexPath").value = "";
};

const init = new URLSearchParams(location.search);
for (const k of ["query", "path", "ext", "after", "before", ...MEDIA_KEYS]) if (init.get(k)) $(k).value = init.get(k);
$("names").checked = init.get("names") === "1";
if (init.get("sort")) $("sort").value = init.get("sort");
for (const [name, m] of Object.entries(EXT_MENUS))
  if (!EXT_MENUS.only.sel.size && init.get(name + "_ext"))  // both at once is not offered: the first one wins
    for (const e of init.get(name + "_ext").split(",")) if (e) m.sel.add(e === "." ? "" : e);
for (const k of NAME_MODS) $(k).checked = init.get(k) === "1";
offset = +(init.get("offset") || 0);
updateSlowNote();
if (init.get("query") || hasMediaFilter()) runSearch({ keepExt: true });
refreshStatus(); setInterval(refreshStatus, 5000);
</script>
</body>
</html>
